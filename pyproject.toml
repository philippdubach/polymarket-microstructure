[project]
name = "polydata"
version = "0.1.0"
description = "Polymarket CLOB data infrastructure for microstructure research"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "eth-abi>=5",
    "eth-utils>=4",
    "tenacity>=8",
    "eth-hash[pycryptodome]>=0.8.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
